<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#101113"><link rel="manifest" href="/manifest.webmanifest"><title>Black Mesa Transit</title><link rel="icon" href="/art/lambda.ico"><link rel="stylesheet" href="/tokens.css"><link rel="stylesheet" href="/style.css"><script defer src="/language.js"></script><script defer src="/app.js"></script></head>
<body>
<div id="launch-reveal" hidden aria-hidden="true">
  <video muted playsinline preload="none" poster="/art/lambda-reveal.webp" src="/art/lambda-reveal.mp4"></video>

<header><div class="brand"><b aria-hidden="true">λ</b><span>BLACK MESA<small>TRANSIT SYSTEM</small></span></div><div class="header-tools"><button type="button" id="profile-player" data-action="playerName" hidden></button><span id="edition"></span><div id="languages" role="group" aria-label="Language">
